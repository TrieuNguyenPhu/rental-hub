# Include within the production server block only.
root /srv/rental-hub/current/dist;
index index.html;
autoindex off;
client_max_body_size 10m;
client_body_timeout 30s;
add_header X-Content-Type-Options nosniff always;

location = /index.html {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /release.json {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /assets/ {
    alias /srv/rental-hub/shared/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /images/ {
    alias /srv/rental-hub/shared/images/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}
location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 40s;
}
location / { try_files $uri $uri/ /index.html; }
