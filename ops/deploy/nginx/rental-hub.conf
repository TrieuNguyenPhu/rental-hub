# Install into /etc/nginx/conf.d/; includes are in the http context.
limit_req_zone $binary_remote_addr zone=rental_hub_upload:10m rate=1r/s;
server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/rental-hub.access.log;
    error_log /var/log/nginx/rental-hub.error.log;
    include /etc/nginx/snippets/rental-hub-locations.conf;
    # Plain HTTP must never challenge for or accept upload credentials.
    location = /api/images { return 403; }
}
