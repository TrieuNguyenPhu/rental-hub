# Private candidate, configured once; deploy changes only the candidate symlink.
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    root /srv/rental-hub/candidate/dist;
    index index.html;
    access_log /var/log/nginx/rental-hub-candidate.access.log;
    error_log /var/log/nginx/rental-hub-candidate.error.log;
    location = /index.html { add_header Cache-Control no-cache; }
    location = /release.json { add_header Cache-Control no-cache; }
    location ^~ /assets/ { alias /srv/rental-hub/shared/assets/; }
    location ^~ /images/ { alias /srv/rental-hub/shared/images/; }
    location /api/ { proxy_pass http://127.0.0.1:3002; }
    location / { try_files $uri $uri/ /index.html; }
}
